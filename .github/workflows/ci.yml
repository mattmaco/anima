name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Rebuild the examples
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Kit smoke test
        run: node kit/smoke.mjs

      - name: Install Playwright for the study page tests
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install chromium

      - name: Study mode tests
        env:
          STUDY_REQUIRE_PLAYWRIGHT: "1"
        run: node --test "study/test/*.test.mjs"

      - name: Build every example (dark and light)
        run: |
          for dir in examples/*/; do
            node "${dir}build.mjs"
            node "${dir}build.mjs" --light
          done

      - name: Committed pages are unchanged
        run: |
          git status --short
          git diff --stat --exit-code
          test -z "$(git status --porcelain)"
